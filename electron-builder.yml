appId: com.zcode.quicklauncher
productName: QuickLauncher
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: out-plugins
    to: plugins/builtin
    filter:
      - '**/*'
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: QuickLauncher
