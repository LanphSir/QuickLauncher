name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交直接顶掉旧任务：CI 只关心最新一次
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（主进程 + 渲染层 + 单测）
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建内置插件
        run: pnpm build:plugins

      - name: 构建应用
        run: pnpm build
